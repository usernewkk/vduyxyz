<style>
  :root{
    --bg:#050805; --panel:#0b110b; --line:#173317; --green:#39ff14; --green-d:#1fb80a;
    --ink:#e8ffe4; --muted:#7fa07a; --err:#ff5c5c;
    --display:"Orbitron","Segoe UI",system-ui,sans-serif;
    --body:"Rajdhani","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:36px 16px 48px;
    background:
      radial-gradient(700px 360px at 50% -80px, rgba(57,255,20,.16), transparent 70%),
      linear-gradient(rgba(57,255,20,.045) 1px, transparent 1px) 0 0/36px 36px,
      linear-gradient(90deg, rgba(57,255,20,.045) 1px, transparent 1px) 0 0/36px 36px,
      var(--bg);
    color:var(--ink);font-family:var(--body);font-size:17px}
  .wrap{width:100%;max-width:460px;text-align:center}

  /* ---- bio header ---- */
  .avatar{position:relative;width:128px;height:128px;margin:0 auto 16px;border-radius:50%;padding:4px;
    background:conic-gradient(from 0deg,var(--green),#0a3a05,var(--green),#0a3a05,var(--green));
    box-shadow:0 0 28px rgba(57,255,20,.45),0 0 70px rgba(57,255,20,.18)}
  .avatar img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg);background:#000}
  .name{margin:0;font-family:var(--display);font-weight:800;font-size:1.55rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--green);text-shadow:0 0 14px rgba(57,255,20,.55)}
  .bio{margin:8px 0 14px;color:var(--muted);font-weight:500;letter-spacing:.02em}
  .status{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;
    font-size:.82rem;font-weight:700;letter-spacing:.14em;color:var(--green);background:rgba(57,255,20,.06)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ---- card ---- */
  .card{margin-top:26px;text-align:left;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 0 0 1px rgba(57,255,20,.06) inset,0 14px 40px rgba(0,0,0,.6);position:relative}
  .card::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:2px;
    background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:.8}
  .sub{margin:0 0 18px;color:var(--muted);font-weight:500;text-align:center}

  .steps{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:8px}
  .steps li{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
    color:var(--muted);font-weight:600;transition:.2s}
  .steps li b{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;
    font-family:var(--display);font-size:.78rem;color:var(--green);border:1px solid var(--green-d);background:rgba(57,255,20,.07)}
  .steps li.done{color:var(--ink);border-color:var(--green-d)}
  .steps li.done b{background:var(--green);color:#031003}

  button{font:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  #get{width:100%;padding:15px;border:0;border-radius:10px;font-family:var(--display);font-weight:800;font-size:1.05rem;
    letter-spacing:.14em;text-transform:uppercase;color:#031003;
    background:linear-gradient(180deg,#5cff3d,var(--green-d));
    box-shadow:0 0 22px rgba(57,255,20,.5),0 3px 0 #0e6b04;transition:transform .12s,box-shadow .12s}
  #get:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 34px rgba(57,255,20,.75),0 4px 0 #0e6b04}
  #get:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 16px rgba(57,255,20,.5),0 1px 0 #0e6b04}
  #get:disabled{opacity:.65;cursor:wait}

  .out{display:none;gap:8px}
  .out.show{display:flex}
  .out input{flex:1;min-width:0;padding:13px 12px;font-family:var(--mono);font-weight:700;font-size:1rem;letter-spacing:.04em;
    color:var(--green);background:#020402;border:1px solid var(--green-d);border-radius:10px;
    box-shadow:0 0 16px rgba(57,255,20,.25) inset}
  .out button{padding:0 18px;border-radius:10px;font-weight:700;letter-spacing:.06em;color:var(--green);
    background:transparent;border:1px solid var(--green-d)}
  .out button:hover{background:rgba(57,255,20,.12)}

  #msg{margin:14px 0 0;min-height:1.3em;text-align:center;font-weight:600;color:var(--err)}
  #msg.ok{color:var(--muted)}
  .foot{margin-top:22px;color:#3d5a39;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase}

  @media (prefers-reduced-motion: reduce){.dot{animation:none} #get{transition:none}}
</style>
</head>

    <h1 class="name" id="name">Gator Keys</h1>
    <p class="bio" id="bio">Vượt link nhanh, nhận key miễn phí</p>
    <span class="status"><span class="dot"></span>ONLINE</span>
  </header>

  <main class="card">
    <p class="sub" id="sub">Hoàn thành link vượt rồi quay lại trang này để nhận key.</p>
    <ol class="steps" id="steps">
      <li class="done"><b>1</b>Bấm Get key</li>
      <li><b>2</b>Vượt link rút gọn</li>
      <li><b>3</b>Quay lại nhận key</li>
    </ol>
    <button id="get">Get key</button>
    <div class="out" id="out">
      <input id="key" readonly aria-label="Key của bạn">
      <button id="copy" type="button">Sao chép</button>
    </div>
    <p id="msg"></p>
  </main>

  <div class="foot">Key có hiệu lực 24 giờ</div>
</div>

<script>
  var $ = function(id){ return document.getElementById(id); };
  var errors = {
    fast: "Bạn quay lại quá nhanh. Hãy hoàn thành link vượt rồi thử lại.",
    expired: "Phiên đã hết hạn. Bấm Get key để tạo lại."
  };

  function markSteps(n){
    var items = document.querySelectorAll("#steps li");
    for (var i = 0; i < items.length; i++) items[i].classList.toggle("done", i < n);
  }
  markSteps(0);

  async function load(){
    var e = new URLSearchParams(location.search).get("e");
    if (e && errors[e]) $("msg").textContent = errors[e];
    try {
      var d = await (await fetch("/api/key")).json();
      if (d.key){
        $("get").style.display = "none";
        $("key").value = d.key;
        $("out").classList.add("show");
        $("sub").textContent = "Xong! Đây là key của bạn.";
        $("msg").textContent = "";
        markSteps(3);
      }
    } catch (err) {}
  }

  $("get").addEventListener("click", async function(){
    var b = $("get");
    b.disabled = true; b.textContent = "Đang tạo link...";
    $("msg").className = ""; $("msg").textContent = "";
    try {
      var r = await fetch("/api/start", { method: "POST" });
      var raw = await r.text(), d;
      try { d = JSON.parse(raw); }
      catch (e) { throw new Error("Không kết nối được server key (nhận về HTML thay vì JSON). Hãy chạy server.js bằng Node và mở trang qua địa chỉ của server, không mở file index.html trực tiếp."); }
      if (!r.ok) throw new Error(d.error || "Có lỗi xảy ra.");
      markSteps(2);
      $("msg").className = "ok"; $("msg").textContent = "Đang chuyển sang link vượt...";
      location.href = d.shortUrl;
    } catch (err) {
      markSteps(0);
      $("msg").textContent = err.message;
      b.disabled = false; b.textContent = "Get key";
    }
  });

  $("copy").addEventListener("click", async function(){
    try { await navigator.clipboard.writeText($("key").value); }
    catch (e) { $("key").select(); document.execCommand("copy"); }
    $("copy").textContent = "Đã chép";
    setTimeout(function(){ $("copy").textContent = "Sao chép"; }, 1500);
  });

  load();
</script>
</body>
</html>
